name: Uppdatera Marina Bilder & Data

on:
  schedule:
    - cron: '0 1 * * *'  # Kör kl 02:00 svensk tid varje natt (01:00 UTC)
  workflow_dispatch:     # Möjliggör manuell körning

jobs:
  build-everything:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Klona repo
        uses: actions/checkout@v3

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: 📦 Installera Node beroenden
        run: npm ci

      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 📦 Installera Python-beroenden
        run: |
          pip install numpy matplotlib scipy shapely geojson pillow scikit-learn pyproj colorcet

      - name: 🌊 Kör MASTER BUILD - Build Everything
        env:
          DMI_API_KEY: ${{ secrets.DMI_API_KEY }}
          SKIP_MANUAL_POINTS: 'true'
        run: python scripts/build_everything.py --quality 85

      - name: 📊 Kontrollera resultat
        run: |
          echo "🔍 Kontrollerar genererade filer..."
          
          # Kontrollera area-parameters data
          if [ -f "public/data/area-parameters-extended.json.gz" ]; then
            FILE_SIZE=$(stat -c%s "public/data/area-parameters-extended.json.gz")
            FILE_SIZE_MB=$((FILE_SIZE / 1024 / 1024))
            echo "✅ Area Parameters: ${FILE_SIZE_MB}MB"
            
            if [ $FILE_SIZE -gt 104857600 ]; then  # 100MB i bytes
              echo "❌ Fil är för stor (${FILE_SIZE_MB}MB > 100MB)"
              exit 1
            fi
          else
            echo "❌ area-parameters-extended.json.gz hittades inte"
            exit 1
          fi
          
          # Kontrollera genererade WebP bilder för alla lager
          TOTAL_IMAGES=0
          
          for DIR in current-images-mercator temperature-images-mercator salinity-images-mercator mackerel-probability-images-mercator; do
            if [ -d "public/data/$DIR" ]; then
              COUNT=$(find public/data/$DIR -name "*.webp" | wc -l)
              echo "✅ $DIR: ${COUNT} WebP-bilder"
              TOTAL_IMAGES=$((TOTAL_IMAGES + COUNT))
            else
              echo "⚠️ $DIR saknas"
            fi
          done
          
          echo "📊 Totalt: ${TOTAL_IMAGES} WebP-bilder genererade"
          
          if [ $TOTAL_IMAGES -lt 100 ]; then
            echo "❌ För få bilder genererade (${TOTAL_IMAGES} < 100)"
            exit 1
          fi

      - name: 🔄 Pusha uppdaterad data och bilder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Lägg till alla genererade filer
          git add public/data/area-parameters-extended.json.gz
          git add public/data/current-images-mercator/
          git add public/data/temperature-images-mercator/
          git add public/data/salinity-images-mercator/
          git add public/data/mackerel-probability-images-mercator/
          
          # Kontrollera om det finns ändringar
          if git diff --staged --quiet; then
            echo "ℹ️ Inga ändringar att commita"
          else
            git commit -m "🌊 Auto-uppdatera marina bilder & data ($(date +'%Y-%m-%d %H:%M'))"
            git push
            echo "✅ Marina bilder och data uppdaterade och pushade"
          fi

      - name: 📝 Sammanfattning
        run: |
          echo "## 🌊 Marina Bilder & Data Uppdaterade" >> $GITHUB_STEP_SUMMARY
          echo "- **Tid**: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "- **Mode**: Cronjob (manuella punkter skippade)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Data-fil info
          if [ -f "public/data/area-parameters-extended.json.gz" ]; then
            FILE_SIZE=$(stat -c%s "public/data/area-parameters-extended.json.gz")
            FILE_SIZE_MB=$((FILE_SIZE / 1024 / 1024))
            echo "### 📦 Data" >> $GITHUB_STEP_SUMMARY
            echo "- **Fil**: area-parameters-extended.json.gz" >> $GITHUB_STEP_SUMMARY
            echo "- **Storlek**: ${FILE_SIZE_MB}MB (komprimerad)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Räkna WebP bilder per lager
          echo "### 🎨 Genererade WebP-bilder" >> $GITHUB_STEP_SUMMARY
          TOTAL=0
          for DIR in current-images-mercator temperature-images-mercator salinity-images-mercator mackerel-probability-images-mercator; do
            if [ -d "public/data/$DIR" ]; then
              COUNT=$(find public/data/$DIR -name "*.webp" | wc -l)
              echo "- **${DIR}**: ${COUNT} bilder" >> $GITHUB_STEP_SUMMARY
              TOTAL=$((TOTAL + COUNT))
            fi
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Totalt**: ${TOTAL} WebP-bilder" >> $GITHUB_STEP_SUMMARY
          echo "- **Kvalitet**: 85/100 (hög kvalitet)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ Status: Klart" >> $GITHUB_STEP_SUMMARY 